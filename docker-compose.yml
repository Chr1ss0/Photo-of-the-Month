# Photo of the Month – App-Container (Frontend + API).
# Ein vorhandener Reverse-Proxy (z. B. Caddy auf dem Host) leitet auf 127.0.0.1:${APP_PORT} weiter.
#
#   cp .env.docker.example .env   (Werte anpassen)
#   ./deploy/update.sh            (bauen/aktualisieren und starten)
services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: photo-of-the-month:latest
    container_name: photo-of-the-month
    restart: unless-stopped
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN in .env setzen}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - potm-data:/data
    # nur lokal erreichbar – von außen ausschließlich über den Reverse-Proxy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  potm-data:
